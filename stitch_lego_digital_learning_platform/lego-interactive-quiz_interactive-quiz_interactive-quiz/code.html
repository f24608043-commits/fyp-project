<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz - LEGO Learn And Go</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #15803d;
      --primary-light: #4ade80;
      --secondary: #f59e0b;
      --secondary-dark: #d97706;
      --tertiary: #3b82f6;
      --tertiary-dark: #1d4ed8;
      --surface: #faf8ff;
      --surface-container: #eaedff;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--surface) 0%, #f0fdf4 100%);
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .progress-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .progress-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--surface-container);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .hearts {
      display: flex;
      gap: 0.25rem;
      font-size: 1.25rem;
    }

    .xp-badge {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--white);
    }

    .quiz-section {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .question-number {
      font-family: 'Rubik', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-family: 'Rubik', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      width: 100%;
      padding: 1.25rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 1rem;
      background: var(--white);
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      border-color: var(--primary);
      border-bottom-color: var(--primary-dark);
      background: var(--surface);
    }

    .option-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .option-btn.correct {
      background: linear-gradient(135deg, var(--success) 0%, var(--primary-dark) 100%);
      border-color: var(--success);
      border-bottom-color: var(--primary-dark);
      color: var(--white);
    }

    .option-btn.incorrect {
      background: linear-gradient(135deg, var(--error) 0%, #b91c1c 100%);
      border-color: var(--error);
      border-bottom-color: #b91c1c;
      color: var(--white);
    }

    .feedback-section {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
    }

    .feedback-section.show {
      display: block;
    }

    .feedback-section.correct {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-color: var(--success);
      border-bottom-color: var(--primary-dark);
    }

    .feedback-section.incorrect {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      border-color: var(--error);
      border-bottom-color: #b91c1c;
    }

    .feedback-mascot {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .feedback-title {
      font-family: 'Rubik', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .feedback-section.correct .feedback-title {
      color: var(--success);
    }

    .feedback-section.incorrect .feedback-title {
      color: var(--error);
    }

    .feedback-message {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary);
      border-bottom: 4px solid var(--primary-dark);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 2px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      .bottom-nav {
        display: flex;
      }

      .container {
        padding-bottom: 5rem;
      }
    }

    @media (min-width: 769px) {
      .bottom-nav {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="progress-info">
        <div class="progress-badge">
          <span>📝</span>
          <span>Question 3 / 5</span>
        </div>
        <div class="hearts">
          <span>❤️</span>
          <span>❤️</span>
          <span>❤️</span>
          <span>❤️</span>
        </div>
      </div>
      <div class="xp-badge">
        <span>⚡</span>
        <span>+20 XP</span>
      </div>
    </div>

    <div class="quiz-section">
      <div class="question-number">Question 3</div>
      <h1 class="question-text">What data type is "LEGO"?</h1>
      
      <div class="options-grid">
        <button class="option-btn" onclick="selectAnswer(this, false)">A. Integer</button>
        <button class="option-btn" onclick="selectAnswer(this, true)">B. String</button>
        <button class="option-btn" onclick="selectAnswer(this, false)">C. Boolean</button>
        <button class="option-btn" onclick="selectAnswer(this, false)">D. Array</button>
      </div>
    </div>

    <div class="feedback-section" id="feedback">
      <div class="feedback-mascot" id="feedbackMascot">😊</div>
      <h2 class="feedback-title" id="feedbackTitle">Great job!</h2>
      <p class="feedback-message" id="feedbackMessage">You got it right! Strings are used for text data.</p>
      <button class="btn btn-primary" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/path" class="nav-item active">
      <span class="nav-icon">🛤️</span>
      <span>Path</span>
    </a>
    <a href="/library" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>Library</span>
    </a>
    <a href="/class" class="nav-item">
      <span class="nav-icon">👨‍🏫</span>
      <span>Class</span>
    </a>
    <a href="/friends" class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Friends</span>
    </a>
    <a href="/leaderboard" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Ranks</span>
    </a>
    <a href="/profile" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    function selectAnswer(button, isCorrect) {
      const options = document.querySelectorAll('.option-btn');
      options.forEach(opt => {
        opt.disabled = true;
        opt.style.cursor = 'not-allowed';
      });

      if (isCorrect) {
        button.classList.add('correct');
        showFeedback(true);
      } else {
        button.classList.add('incorrect');
        showFeedback(false);
      }
    }

    function showFeedback(isCorrect) {
      const feedback = document.getElementById('feedback');
      const mascot = document.getElementById('feedbackMascot');
      const title = document.getElementById('feedbackTitle');
      const message = document.getElementById('feedbackMessage');

      feedback.classList.add('show');
      
      if (isCorrect) {
        feedback.classList.add('correct');
        feedback.classList.remove('incorrect');
        mascot.textContent = '😄';
        title.textContent = 'Great job!';
        message.textContent = 'You got it right! Strings are used for text data.';
      } else {
        feedback.classList.add('incorrect');
        feedback.classList.remove('correct');
        mascot.textContent = '😢';
        title.textContent = 'Not quite!';
        message.textContent = 'Let\'s learn from it! Strings are sequences of characters enclosed in quotes.';
      }
    }

    function nextQuestion() {
      alert('Moving to next question...');
    }
  </script>
</body>
</html>
