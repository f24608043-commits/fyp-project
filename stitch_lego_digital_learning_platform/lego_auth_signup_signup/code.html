<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - LEGO Learn And Go</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #15803d;
      --primary-light: #4ade80;
      --secondary: #f59e0b;
      --secondary-dark: #d97706;
      --tertiary: #3b82f6;
      --tertiary-dark: #1d4ed8;
      --surface: #faf8ff;
      --surface-container: #eaedff;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--surface) 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: 1.5rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      box-shadow: 0 8px 24px -4px rgba(34, 197, 94, 0.18);
      padding: 2rem;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-family: 'Rubik', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mascot {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      border-radius: 50%;
      border: 3px solid var(--primary-dark);
      border-bottom: 6px solid var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .headline {
      font-family: 'Rubik', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .supporting-text {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.9375rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-family: 'Rubik', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 0.75rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      transition: all 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      border-bottom-color: var(--primary-dark);
      background: var(--white);
    }

    .input.error {
      border-color: var(--error);
      border-bottom-color: #b91c1c;
    }

    .input-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-secondary);
    }

    .password-strength {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.3s ease;
    }

    .strength-bar.weak { background: var(--error); }
    .strength-bar.medium { background: var(--secondary); }
    .strength-bar.strong { background: var(--primary); }

    .strength-text {
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .strength-text.weak { color: var(--error); }
    .strength-text.medium { color: var(--secondary); }
    .strength-text.strong { color: var(--primary); }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary);
      border-bottom: 4px solid var(--primary-dark);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-light);
      border-bottom-color: var(--primary-dark);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-secondary {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      border-color: var(--tertiary);
      border-bottom-color: var(--tertiary-dark);
    }

    .btn-secondary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--border);
    }

    .divider span {
      padding: 0 1rem;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .google-icon {
      width: 24px;
      height: 24px;
    }

    .bottom-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .bottom-text a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      padding: 0.75rem;
      background: #fef2f2;
      border: 2px solid var(--error);
      border-bottom: 4px solid #b91c1c;
      border-radius: 0.75rem;
      color: var(--error);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .success-message {
      padding: 0.75rem;
      background: #f0fdf4;
      border: 2px solid var(--success);
      border-bottom: 4px solid var(--primary-dark);
      border-radius: 0.75rem;
      color: var(--success);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem;
      }

      .headline {
        font-size: 1.5rem;
      }

      .mascot {
        width: 64px;
        height: 64px;
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <div class="mascot">😊</div>
      <div class="logo">LEGO</div>
      <div class="tagline">Learn And Go</div>
    </div>

    <h1 class="headline">Start Your Learning Journey</h1>
    <p class="supporting-text">Create your account and start learning with LEGO.</p>

    <form class="form" id="signupForm">
      <div class="form-group">
        <label class="label" for="fullName">Full Name</label>
        <input type="text" id="fullName" class="input" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label class="label" for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="input" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
        </div>
        <div class="password-strength">
          <div class="strength-bar" id="strength1"></div>
          <div class="strength-bar" id="strength2"></div>
          <div class="strength-bar" id="strength3"></div>
          <div class="strength-bar" id="strength4"></div>
        </div>
        <div class="strength-text" id="strengthText">Password strength</div>
      </div>

      <div class="form-group">
        <label class="label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" class="input" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <button class="btn btn-secondary google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="bottom-text">
      Already have an account? <a href="/signin">Sign In</a>
    </div>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    const passwordInput = document.getElementById('password');
    const strengthBars = [
      document.getElementById('strength1'),
      document.getElementById('strength2'),
      document.getElementById('strength3'),
      document.getElementById('strength4')
    ];
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;

      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/\d/)) strength++;
      if (password.match(/[^a-zA-Z\d]/)) strength++;

      strengthBars.forEach((bar, index) => {
        bar.className = 'strength-bar';
        if (index < strength) {
          if (strength <= 1) bar.classList.add('weak');
          else if (strength <= 2) bar.classList.add('medium');
          else bar.classList.add('strong');
        }
      });

      strengthText.className = 'strength-text';
      if (strength <= 1) {
        strengthText.textContent = 'Weak';
        strengthText.classList.add('weak');
      } else if (strength <= 2) {
        strengthText.textContent = 'Medium';
        strengthText.classList.add('medium');
      } else {
        strengthText.textContent = 'Strong';
        strengthText.classList.add('strong');
      }
    });

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      // Simulate form submission
      this.classList.add('loading');
      setTimeout(() => {
        this.classList.remove('loading');
        alert('Account created successfully!');
      }, 1500);
    });
  </script>
</body>
</html>
