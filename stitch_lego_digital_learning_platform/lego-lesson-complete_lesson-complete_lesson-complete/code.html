<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Complete - LEGO Learn And Go</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #15803d;
      --primary-light: #4ade80;
      --secondary: #f59e0b;
      --secondary-dark: #d97706;
      --tertiary: #3b82f6;
      --tertiary-dark: #1d4ed8;
      --surface: #faf8ff;
      --surface-container: #eaedff;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--surface) 0%, #f0fdf4 100%);
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .celebration-section {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 1rem;
      padding: 3rem 2rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .mascot {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .headline {
      font-family: 'Rubik', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .subheadline {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface-container);
      border-radius: 1rem;
      padding: 1.5rem;
    }

    .stat-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Rubik', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .accuracy-section {
      background: linear-gradient(135deg, var(--success) 0%, var(--primary-dark) 100%);
      border: 2px solid var(--success);
      border-bottom: 4px solid var(--primary-dark);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--white);
      text-align: center;
    }

    .accuracy-value {
      font-family: 'Rubik', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .accuracy-label {
      font-size: 0.875rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .streak-section {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      border: 2px solid var(--secondary);
      border-bottom: 4px solid var(--secondary-dark);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--white);
      text-align: center;
    }

    .streak-value {
      font-family: 'Rubik', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .streak-label {
      font-size: 0.875rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .achievement-section {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      display: none;
    }

    .achievement-section.show {
      display: block;
    }

    .achievement-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .achievement-title {
      font-family: 'Rubik', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .achievement-description {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary);
      border-bottom: 4px solid var(--primary-dark);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 2px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .bottom-nav {
        display: flex;
      }

      .container {
        padding-bottom: 5rem;
      }
    }

    @media (min-width: 769px) {
      .bottom-nav {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="celebration-section">
      <div class="mascot">🎉</div>
      <h1 class="headline">Lesson Complete!</h1>
      <p class="subheadline">Great work on mastering Variables, Strings & Types</p>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-value">+20</div>
          <div class="stat-label">XP Earned</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-value">+1</div>
          <div class="stat-label">Lesson</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-value">7</div>
          <div class="stat-label">Day Streak</div>
        </div>
      </div>
    </div>

    <div class="accuracy-section">
      <div class="accuracy-value">100%</div>
      <div class="accuracy-label">Quiz Accuracy</div>
    </div>

    <div class="streak-section">
      <div class="streak-value">🔥 7 Days</div>
      <div class="streak-label">Current Streak</div>
    </div>

    <div class="achievement-section show">
      <div class="achievement-icon">🏅</div>
      <h2 class="achievement-title">New Badge Unlocked!</h2>
      <p class="achievement-description">Quiz Champion - Score 100% on 3 quizzes</p>
    </div>

    <button class="btn btn-primary">Continue to Next Lesson</button>
  </div>

  <nav class="bottom-nav">
    <a href="/path" class="nav-item active">
      <span class="nav-icon">🛤️</span>
      <span>Path</span>
    </a>
    <a href="/library" class="nav-item">
      <span class="nav-icon">📚</span>
      <span>Library</span>
    </a>
    <a href="/class" class="nav-item">
      <span class="nav-icon">👨‍🏫</span>
      <span>Class</span>
    </a>
    <a href="/friends" class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Friends</span>
    </a>
    <a href="/leaderboard" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Ranks</span>
    </a>
    <a href="/profile" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>
</body>
</html>
