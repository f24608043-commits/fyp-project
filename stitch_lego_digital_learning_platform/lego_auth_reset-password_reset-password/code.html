<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - LEGO Learn And Go</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #15803d;
      --primary-light: #4ade80;
      --secondary: #f59e0b;
      --secondary-dark: #d97706;
      --tertiary: #3b82f6;
      --tertiary-dark: #1d4ed8;
      --surface: #faf8ff;
      --surface-container: #eaedff;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--surface) 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 1.5rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      box-shadow: 0 8px 24px -4px rgba(34, 197, 94, 0.18);
      padding: 2rem;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-family: 'Rubik', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mascot {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      border-radius: 50%;
      border: 3px solid var(--primary-dark);
      border-bottom: 6px solid var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
    }

    .headline {
      font-family: 'Rubik', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .supporting-text {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-family: 'Rubik', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 0.75rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      transition: all 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      border-bottom-color: var(--primary-dark);
      background: var(--white);
    }

    .input.error {
      border-color: var(--error);
      border-bottom-color: #b91c1c;
    }

    .input-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-secondary);
    }

    .password-strength {
      display: flex;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.3s ease;
    }

    .strength-bar.weak { background: var(--error); }
    .strength-bar.medium { background: var(--secondary); }
    .strength-bar.strong { background: var(--primary); }

    .strength-text {
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .strength-text.weak { color: var(--error); }
    .strength-text.medium { color: var(--secondary); }
    .strength-text.strong { color: var(--primary); }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary);
      border-bottom: 4px solid var(--primary-dark);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-light);
      border-bottom-color: var(--primary-dark);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .error-message {
      padding: 0.75rem;
      background: #fef2f2;
      border: 2px solid var(--error);
      border-bottom: 4px solid #b91c1c;
      border-radius: 0.75rem;
      color: var(--error);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .success-message {
      padding: 0.75rem;
      background: #f0fdf4;
      border: 2px solid var(--success);
      border-bottom: 4px solid var(--primary-dark);
      border-radius: 0.75rem;
      color: var(--success);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem;
      }

      .headline {
        font-size: 1.25rem;
      }

      .mascot {
        width: 56px;
        height: 56px;
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <div class="mascot">💪</div>
      <div class="logo">LEGO</div>
      <div class="tagline">Learn And Go</div>
    </div>

    <h1 class="headline">Create a New Password</h1>
    <p class="supporting-text">Enter your new password below.</p>

    <form class="form" id="resetPasswordForm">
      <div class="form-group">
        <label class="label" for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="newPassword" class="input" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">👁️</button>
        </div>
        <div class="password-strength">
          <div class="strength-bar" id="strength1"></div>
          <div class="strength-bar" id="strength2"></div>
          <div class="strength-bar" id="strength3"></div>
          <div class="strength-bar" id="strength4"></div>
        </div>
        <div class="strength-text" id="strengthText">Password strength</div>
      </div>

      <div class="form-group">
        <label class="label" for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" class="input" placeholder="••••••••" required>
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    const passwordInput = document.getElementById('newPassword');
    const strengthBars = [
      document.getElementById('strength1'),
      document.getElementById('strength2'),
      document.getElementById('strength3'),
      document.getElementById('strength4')
    ];
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;

      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/\d/)) strength++;
      if (password.match(/[^a-zA-Z\d]/)) strength++;

      strengthBars.forEach((bar, index) => {
        bar.className = 'strength-bar';
        if (index < strength) {
          if (strength <= 1) bar.classList.add('weak');
          else if (strength <= 2) bar.classList.add('medium');
          else bar.classList.add('strong');
        }
      });

      strengthText.className = 'strength-text';
      if (strength <= 1) {
        strengthText.textContent = 'Weak';
        strengthText.classList.add('weak');
      } else if (strength <= 2) {
        strengthText.textContent = 'Medium';
        strengthText.classList.add('medium');
      } else {
        strengthText.textContent = 'Strong';
        strengthText.classList.add('strong');
      }
    });

    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('Passwords do not match!');
        return;
      }

      this.classList.add('loading');
      setTimeout(() => {
        this.classList.remove('loading');
        
        // Show success state
        this.innerHTML = `
          <div class="success-message" style="text-align: center; padding: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
            <div style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">Password Updated!</div>
            <button class="btn btn-primary" onclick="window.location.href='/signin'" style="margin-top: 1rem;">Continue to LEGO</button>
          </div>
        `;
      }, 1500);
    });
  </script>
</body>
</html>
