<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - LEGO Learn And Go</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #15803d;
      --primary-light: #4ade80;
      --secondary: #f59e0b;
      --secondary-dark: #d97706;
      --tertiary: #3b82f6;
      --tertiary-dark: #1d4ed8;
      --surface: #faf8ff;
      --surface-container: #eaedff;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--surface) 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 1.5rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      box-shadow: 0 8px 24px -4px rgba(34, 197, 94, 0.18);
      padding: 2rem;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      font-family: 'Rubik', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mascot {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      border-radius: 50%;
      border: 3px solid var(--primary-dark);
      border-bottom: 6px solid var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
    }

    .headline {
      font-family: 'Rubik', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .supporting-text {
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-family: 'Rubik', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      border-radius: 0.75rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      transition: all 0.2s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      border-bottom-color: var(--primary-dark);
      background: var(--white);
    }

    .input.error {
      border-color: var(--error);
      border-bottom-color: #b91c1c;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 0.75rem;
      font-family: 'Rubik', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--primary);
      border-bottom: 4px solid var(--primary-dark);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-light);
      border-bottom-color: var(--primary-dark);
    }

    .btn-primary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-secondary {
      background: var(--white);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border-dark);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      border-color: var(--tertiary);
      border-bottom-color: var(--tertiary-dark);
    }

    .btn-secondary:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .bottom-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .bottom-text a {
      color: var(--tertiary);
      font-weight: 600;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      padding: 0.75rem;
      background: #fef2f2;
      border: 2px solid var(--error);
      border-bottom: 4px solid #b91c1c;
      border-radius: 0.75rem;
      color: var(--error);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .success-message {
      padding: 0.75rem;
      background: #f0fdf4;
      border: 2px solid var(--success);
      border-bottom: 4px solid var(--primary-dark);
      border-radius: 0.75rem;
      color: var(--success);
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem;
      }

      .headline {
        font-size: 1.25rem;
      }

      .mascot {
        width: 56px;
        height: 56px;
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-section">
      <div class="mascot">🤔</div>
      <div class="logo">LEGO</div>
      <div class="tagline">Learn And Go</div>
    </div>

    <h1 class="headline">Reset Your Password</h1>
    <p class="supporting-text">Enter your email and we'll help you get back into LEGO.</p>

    <form class="form" id="forgotPasswordForm">
      <div class="form-group">
        <label class="label" for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="alex@example.com" required>
      </div>

      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>

    <div class="bottom-text">
      <a href="/signin">Back to Sign In</a>
    </div>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;

      // Simulate API call
      this.classList.add('loading');
      setTimeout(() => {
        this.classList.remove('loading');
        
        // Show success message
        const successDiv = document.createElement('div');
        successDiv.className = 'success-message';
        successDiv.textContent = 'Reset link sent! Check your email.';
        this.insertBefore(successDiv, this.firstChild);
        
        // Disable form
        this.querySelector('button').disabled = true;
        this.querySelector('input').disabled = true;
      }, 1500);
    });
  </script>
</body>
</html>
